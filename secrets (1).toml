# Copy this file to .streamlit/secrets.toml and fill in your real token.
# .streamlit/secrets.toml itself is git-ignored so your token never gets
# committed. On Streamlit Community Cloud, you don't need this file at
# all — just paste the same key/value into Settings -> Secrets.

UPSTOX_ACCESS_TOKEN = "YOUR_UPSTOX_ACCESS_TOKEN_HERE"
